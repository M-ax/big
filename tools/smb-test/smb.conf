[global]
    server role = standalone server
    server min protocol = SMB2
    server max protocol = SMB3
    map to guest = Bad User
    logging = stdout
    load printers = no
    disable spoolss = yes

[Media]
    path = /shares/media
    read only = yes
    valid users = smbtest

[Public]
    path = /shares/public
    read only = yes
    guest ok = yes

[Denied]
    path = /shares/media
    read only = yes
    valid users = root